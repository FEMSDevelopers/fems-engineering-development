# No authentication in the app yet: keep this ingress on an internal/VPN-only hostname,
# or add auth at the ingress (basic auth / oauth2-proxy) before exposing it more widely.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fpl-app
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts: [pointlist.internal.example.com]
  #     secretName: fpl-tls
  rules:
    - host: pointlist.internal.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: fpl-app, port: { name: http } } }
