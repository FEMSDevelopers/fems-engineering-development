# NOT included in kustomization.yaml. Create the real secret out-of-band, e.g.:
#   kubectl -n fractal-pointlist create secret generic fpl-db \
#     --from-literal=POSTGRES_PASSWORD='<strong password>' \
#     --from-literal=DATABASE_URL='postgres://fpl:<strong password>@fpl-postgres:5432/fpl'
apiVersion: v1
kind: Secret
metadata:
  name: fpl-db
  namespace: fractal-pointlist
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgres://fpl:change-me@fpl-postgres:5432/fpl
