apiVersion: v1
kind: ConfigMap
metadata:
  name: fpl-config
data:
  LOG_LEVEL: info
  BODY_LIMIT: "52428800"
  # Migrations run on start behind a Postgres advisory lock, so multiple replicas are safe.
  MIGRATE_ON_START: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fpl-app
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: fpl-app }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: fpl-app }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: fractal-pointlist
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080, name: http }]
          envFrom: [{ configMapRef: { name: fpl-config } }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: fpl-db, key: DATABASE_URL } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: fpl-app
spec:
  selector: { app.kubernetes.io/name: fpl-app }
  ports: [{ name: http, port: 80, targetPort: http }]
