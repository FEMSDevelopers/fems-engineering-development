# kubectl apply -k deploy/k8s
# Set your registry/tag here (or: kustomize edit set image fractal-pointlist=REGISTRY/fractal-pointlist:TAG).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fractal-pointlist
resources:
  - namespace.yaml
  - postgres.yaml
  - app.yaml
  - ingress.yaml
  - networkpolicy.yaml
images:
  - name: fractal-pointlist
    newName: registry.example.com/engineering/fractal-pointlist
    newTag: "0.1.0"
labels:
  - pairs:
      app.kubernetes.io/part-of: fractal-pointlist
