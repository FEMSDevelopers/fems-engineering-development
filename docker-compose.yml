# Local development / single-host run.
#   npm run db:up          -> just PostgreSQL (for `npm run dev`)
#   docker compose up -d   -> PostgreSQL + the app on http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fpl
      POSTGRES_PASSWORD: fpl_dev_password
      POSTGRES_DB: fpl
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fpl -d fpl"]
      interval: 5s
      retries: 10

  app:
    build: { context: ., dockerfile: docker/Dockerfile }
    image: fractal-pointlist:local
    environment:
      DATABASE_URL: postgres://fpl:fpl_dev_password@db:5432/fpl
      LOG_LEVEL: info
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
